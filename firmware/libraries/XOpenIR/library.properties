paragraph=Decodifica dei frame IR X-TAG (colpi e comandi) e trasmissione dei soli comandi di supporto: respawn, riarmo, cura. Trasmissione su Timer2/D3; ricezione con un TSOP su interrupt esterno, o fino a sei TSOP indipendenti campionati a timer. Include la croce di taratura a cinque sensori gia' pronta. Non genera colpi.
